
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker para resolver nombres de servicio en la red virtual
    resolver 8.8.8.8 valid=30s;
    # Soporte para rutas SPA en React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso transparente hacia el backend Spring Boot
    location /api/ {
        proxy_pass ${backend_url:-http://backend:8080};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
